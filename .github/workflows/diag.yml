# Diagnóstico: compila para emulador (x86_64), instala, abre o app e publica o log (logcat) e um print.
name: Diagnóstico no emulador

on:
  push:
    branches: [diag]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - name: Compilar APK x86_64
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: |
            mkdir -p diag
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.seunome.fichariotcg android.permission.CAMERA || true
            adb logcat -c
            adb shell am start -W -n com.seunome.fichariotcg/.MainActivity || true
            sleep 20
            adb exec-out screencap -p > diag/01-vazio.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "fichariotcg://dev-seed" com.seunome.fichariotcg || true
            sleep 60
            adb exec-out screencap -p > diag/02-painel.png || true
            adb shell input swipe 160 520 160 140 1200; sleep 3; adb exec-out screencap -p > diag/03-painel.png || true
            adb shell input swipe 160 520 160 140 1200; sleep 3; adb exec-out screencap -p > diag/04-painel.png || true
            adb shell input swipe 160 520 160 140 1200; sleep 3; adb exec-out screencap -p > diag/05-painel.png || true
            adb shell input swipe 160 520 160 140 1200; sleep 3; adb exec-out screencap -p > diag/06-painel.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "fichariotcg://card/sv03-125" com.seunome.fichariotcg || true
            sleep 15
            adb exec-out screencap -p > diag/07-carta.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "fichariotcg://search?q=charizard" com.seunome.fichariotcg || true
            sleep 20
            adb exec-out screencap -p > diag/08-busca.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "fichariotcg://pokemon/6?name=Charizard" com.seunome.fichariotcg || true
            sleep 20
            adb exec-out screencap -p > diag/09-pokedex.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "fichariotcg://scan" com.seunome.fichariotcg || true
            sleep 15
            adb exec-out screencap -p > diag/10-scan.png || true
            (adb shell pidof com.seunome.fichariotcg && echo "APP RODANDO") > diag/status.txt || echo "APP FECHOU" > diag/status.txt
            adb logcat -d > diag/logcat-completo.txt
      - name: Publicar diagnóstico
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: diag-${{ github.run_number }}
          name: Diagnóstico ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: diag/*
