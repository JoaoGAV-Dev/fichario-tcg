# Gera o APK Android a cada push na main (ou manualmente em Actions > "Gerar APK" > Run workflow)
# e publica em Releases, de onde dá para baixar direto no celular.
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Gerar projeto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK (release, arm64)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/fichario-tcg-v1.0.${BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fichario-tcg-apk
          path: dist/*.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fichário TCG v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            APK para Android (arm64 — Samsung S24 Ultra e celulares de 2017 para cá).
            No celular: baixe o arquivo .apk abaixo, abra e permita "instalar apps desta fonte".
            Commit: ${{ github.sha }}
          files: dist/*.apk
