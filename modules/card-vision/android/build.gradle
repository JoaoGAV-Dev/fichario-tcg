plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cardvision'
version = '1.0.0'

android {
  namespace "expo.modules.cardvision"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Câmera (mesma versão do expo-camera), detecção da borda (OpenCV) e rede neural (TensorFlow Lite).
  // Tudo roda no aparelho, offline e sem custo.
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation 'org.opencv:opencv:4.10.0'
  implementation 'org.tensorflow:tensorflow-lite:2.16.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
  // idioma da embalagem dos lacrados (português x inglês) pelo texto impresso
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
